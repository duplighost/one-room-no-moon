      <path d="M29 7C122 48 165 76 226 117" stroke="#fff0b8" stroke-width="4" opacity="0.72"/>
      <path d="M-22-8C-96-39-148-76-242-113" stroke="#89e7ff" stroke-width="4" opacity="0.68"/>
