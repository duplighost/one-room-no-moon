  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
    <text x="480" y="468" fill="#f4f7ff" font-size="42" font-weight="900" letter-spacing="-1.5">NO MOON ARCADE</text>
    <text x="480" y="500" fill="#b9eaff" font-size="18" font-weight="800" letter-spacing="4">ONE ROOM / ENDLESS RESET</text>
  </g>
</svg>
