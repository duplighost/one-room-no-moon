<html lang="en">
<head>

<title>Boon Moots</title>
<style>
:root{--bg:#05010c;--ink:#fff7ff;--muted:#cabee0;--line:rgba(255,255,255,.16);--hot:#ff2bd6;--cold:#00f5ff;--gold:#ffe66d;--green:#30ff87;--glass:rgba(10,6,18,.74);--shadow:0 16px 45px rgba(0,0,0,.45);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0;overflow:hidden;background:radial-gradient(circle at 50% 35%,#3d1055 0%,#090612 52%,#020106 100%);color:var(--ink)}body{touch-action:none;overscroll-behavior:none;user-select:none}#game{position:fixed;inset:0;width:100vw;height:100vh;display:block;background:#05010c}.panel{background:linear-gradient(145deg,rgba(9,4,21,.72),rgba(46,10,58,.48));border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);backdrop-filter:blur(14px)}#hud{position:fixed;z-index:5;left:max(10px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));width:min(420px,calc(100vw - 20px));pointer-events:none;opacity:.75}#topline{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px}#zone{font-weight:950;text-transform:uppercase;font-size:12px;letter-spacing:.04em;text-shadow:0 0 14px rgba(255,43,214,.42);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.topActions{display:flex;gap:6px;pointer-events:auto;flex-shrink:0}.miniBtn{appearance:none;border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:8px 10px;min-height:44px;color:#fff;background:rgba(255,255,255,.07);font:800 12px inherit;cursor:pointer}#stats{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;gap:6px;padding:0 10px 10px;font-size:12px;color:var(--muted)}.pill{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.055);border-radius:999px;padding:6px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#hp{color:#ff9bbc;letter-spacing:.06em}#score{color:#fff}#combo{color:var(--gold);font-weight:950}#pulse{grid-column:1/-1;height:9px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.10)}#pulseFill{height:100%;width:0;background:linear-gradient(90deg,var(--hot),var(--cold),var(--gold));transition:width .12s linear}#whisper{position:fixed;z-index:8;left:50%;top:calc(max(82px,env(safe-area-inset-top) + 76px));transform:translate(-50%,-8px);opacity:0;width:min(760px,calc(100vw - 24px));padding:11px 14px;text-align:center;pointer-events:none;transition:opacity .2s,transform .2s;background:rgba(8,5,14,.78);border:1px solid rgba(255,255,255,.16);border-radius:999px;box-shadow:var(--shadow);backdrop-filter:blur(12px);font-weight:900;font-size:13px;color:#fff}#whisper.show{opacity:1;transform:translate(-50%,0)}#overlay,#upgrade,#codex{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:max(18px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));background:radial-gradient(circle at 50% 32%,rgba(110,42,142,.36),rgba(2,1,8,.88) 62%,#020106 100%)}#overlay.show,#upgrade.show,#codex.show{display:flex}.modal{position:relative;width:min(880px,calc(100vw - 28px));padding:24px}.modal::before{content:'';position:absolute;inset:-1px;border-radius:19px;padding:1px;background:linear-gradient(145deg,rgba(255,43,214,.28),rgba(0,245,255,.18),transparent 60%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}#overlayTitle{font-size:clamp(52px,10vw,118px);line-height:.88;letter-spacing:-.075em;text-transform:uppercase;text-shadow:0 0 40px rgba(255,43,214,.55),0 0 80px rgba(0,245,255,.25);margin:0 0 12px}#overlayCopy{font-size:16px;color:#f1e4ff;max-width:70ch;line-height:1.55;white-space:pre-line;text-shadow:0 0 12px rgba(0,245,255,.18)}.buttonRow{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.bigBtn,.upgradeCard{appearance:none;border:1px solid rgba(255,255,255,.18);color:#fff;background:rgba(255,255,255,.08);border-radius:999px;padding:13px 15px;min-height:44px;font:900 14px inherit;cursor:pointer}.bigBtn:first-child{background:linear-gradient(135deg,rgba(255,43,214,.95),rgba(0,245,255,.72));color:#16061d;border:0}#upgrade .modal{width:min(980px,calc(100vw - 28px))}#upgradeTitle{margin:0 0 14px;font-size:clamp(24px,4.6vw,48px);letter-spacing:-.045em}#upgradeCards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.upgradeCard{border-radius:22px;text-align:left;padding:16px;min-height:164px;background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.045));box-shadow:var(--shadow)}.upgradeCard .uIcon{font-size:34px;margin-bottom:8px}.upgradeCard b{display:block;font-size:18px;margin-bottom:7px}.upgradeCard p{margin:0;color:#d9cce8;line-height:1.35;font-size:13px}#codex{z-index:21;align-items:stretch;overflow:auto}#codex .modal{width:min(960px,calc(100vw - 24px));max-height:calc(100vh - 40px);overflow:auto;padding:20px}#codex h2{font-size:34px;margin:0 0 10px;letter-spacing:-.045em}#codex h3{margin:18px 0 8px}#codex p,#codex li{color:#e8dcf3;line-height:1.45}.codexGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.codexCard{padding:12px;border-radius:16px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.055)}.codexCard b{display:block;margin-bottom:4px}#pause,#shrine{position:fixed;inset:0;z-index:22;display:none;align-items:center;justify-content:center;padding:max(18px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));background:radial-gradient(circle at 50% 32%,rgba(110,42,142,.36),rgba(2,1,8,.88) 62%,#020106 100%)}#pause.show,#shrine.show{display:flex}#shrine .modal{width:min(960px,calc(100vw - 24px));max-height:calc(100vh - 40px);overflow:auto;padding:20px}.shrineCard{padding:14px;border-radius:16px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.055);cursor:pointer;text-align:left;min-height:110px}.shrineCard:hover{border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.09)}.shrineCard b{display:block;margin-bottom:4px}.shrineCard p{margin:0;color:#d9cce8;line-height:1.35;font-size:13px}.shrineCard .sCost{color:#ffe66d;font-weight:900;font-size:13px;margin-top:6px}.shrineCard.owned{border-color:rgba(48,255,135,.3);background:rgba(48,255,135,.06)}.shrineCard.owned .sCost{color:#30ff87}@media(max-width:720px){#hud{width:auto;max-width:calc(100vw - 20px);opacity:.82}#topline{padding:6px 10px}#zone{display:none}.miniBtn{font-size:11px;padding:8px 8px}#stats{grid-template-columns:1fr;font-size:11px;gap:5px}#score,#room,#combo{display:none}#whisper{top:calc(max(84px,env(safe-area-inset-top) + 82px));border-radius:18px}.modal{padding:18px}#overlayCopy{font-size:14px}#upgradeCards{grid-template-columns:1fr}.upgradeCard{min-height:118px}}@media(max-height:520px) and (orientation:landscape){#hud{width:min(540px,calc(100vw - 20px));opacity:1}#topline{display:flex}#stats{grid-template-columns:repeat(5,1fr);font-size:10px}#score,#room,#combo{display:block}#pulse{display:none}#whisper{top:max(62px,env(safe-area-inset-top) + 58px)}}

<canvas id="game"></canvas>
<div id="hud" class="panel"><div id="topline"><div id="zone">Boon Moots</div><div class="topActions"><button class="miniBtn" id="soundBtn">sound on</button><button class="miniBtn" id="codexBtn">codex</button></div></div><div id="stats"><div class="pill" id="hp">♥♥♥♥♥</div><div class="pill" id="score">0</div><div class="pill" id="room">room 0</div><div class="pill" id="combo">two thumbs</div><div class="pill">pulse</div><div id="pulse"><div id="pulseFill"></div></div></div></div>

  function startRun(seedText=Date.now()){
    const seed = hashString(String(seedText)+'|thumbprint|'+(state.save.runs||0));
    state.rng = mulberry32(seed);
    state.run = {seed, level:0, score:0, combo:1, comboT:0, kills:0, roomKills:0, upgrades:[], overdrive:false, observed:false, truth:false, streak:0, streakT:0};
    state.run.player = makePlayer();
    // Apply shrine bonuses
    const sh = state.save.shrine || {};
    for(const sd of shrineDefs){
      if(sh[sd.id] && sd.apply) sd.apply(state.run.player);
    }
    state.save.runs = (state.save.runs||0)+1;
    state.mode = 'play'; hideOverlay(); hideUpgrade(); hideShrine();
    // Headstart shrine
    if(sh['shrine_head']){
      nextRoom(); // room 1
      nextRoom(); // room 2 (headstart)
    } else {
      nextRoom();
    }
    audio.ensure(); updateHUD(); saveNow();
  }

  function nextRoom(){
    const run=state.run; run.level += 1; run.roomKills = 0;
    const theme = roomThemeForLevel(run.level);
    state.room = makeRoom(run.level, theme);
    const p=run.player; p.x=state.room.w*.5; p.y=state.room.h*.66; p.vx=p.vy=0; p.inv=.9; p.roomHit=false; p.stillT=0; p.dashT=0; p.wasMoving=false; p.brakeT=0; p.after.length=0;
    hardClearTouchPads(); state.input.suppressUntil=performance.now()+160;
    camX=p.x-(W/viewScale)*.5; camY=p.y-(H/viewScale)*.5;
    if(run.level === 8 && !run.observed){ run.observed=true; addNotice(behaviorNotices.care); }
    if(run.level === 14 && !run.overdrive){ run.overdrive=true; addNotice(behaviorNotices.endless); }
  }

  // ========== Room generation: roommix2 biome layouts + v4.0 ambient/floorDeco ==========
  function makeRoom(level, theme){
    const rng=state.rng;
    const room = {level,theme,w:1500,h:(mobile&&portrait?1480:1050),enemies:[],bullets:[],pickups:[],particles:[],floats:[],obstacles:[],decor:[],hazards:[],lanes:[],care:[],portals:[],cleared:false,clearT:0,time:0,spawnT:0,ambient:[],floorDeco:[]};
    const decorKinds = theme.decor || ['spark','paper','cassette','leaf','stone'];
    const decorCount = mobile ? (theme.noMoon?22:16) : (theme.noMoon?38:28);
    for(let i=0;i<decorCount;i++) room.decor.push({x:randR(70,room.w-70,rng),y:randR(70,room.h-70,rng),r:randR(4,18,rng),a:rng()*TAU,kind:pick(decorKinds,rng)});

    // Obstacle placement using roommix2's biome-aware layout system
    const obsCount = (mobile ? 3 : 5) + (theme.noMoon ? (mobile?1:2) : 0);
    for(let i=0;i<obsCount;i++){
      const spot=noMoonObstacleSpot(room, theme.layout || 'scatter', i, obsCount, rng);
      const x=spot.x, y=spot.y;
      if(dist(x,y,room.w*.5,room.h*.66)<260) continue;
      const style=pick(theme.obstacles || ['streetBlock','neonStone'],rng);
      room.obstacles.push(rng()<.55?{type:'rect',x:x-55,y:y-40,w:110+rng()*110,h:80+rng()*50,r:18,style}:{type:'circle',x,y,rad:42+rng()*38,style});
    }

    // No Moon biome hazards (roommix2 system)
    seedNoMoonRoom(room, level, theme, rng);

    // v4.0 ambient particles
    const ambCount = mobile ? 24 : 40;
    for(let i=0;i<ambCount;i++){
      const type = pick(theme.ambient, rng);
      room.ambient.push({
        type, x: rng()*room.w, y: rng()*room.h,
        vx: randR(-12,12,rng), vy: randR(-18,8,rng),
        phase: rng()*TAU, r: randR(1.5,4,rng)
      });
    }

    // v4.0 floor decorations
    const decoTypes = pick([['fogBank','cracks'],['hexes','glowDots'],['roots','pools'],['fogBank','hexes'],['cracks','glowDots'],['roots','fogBank']], rng);
    const floorCount = mobile ? 18 : 35;
    for(let i=0;i<floorCount;i++){
      room.floorDeco.push({type:pick(decoTypes,rng), x:randR(60,room.w-60,rng), y:randR(60,room.h-60,rng), r:randR(20,65,rng), a:rng()*TAU});
    }

    // Care objects
    if(level>=8 || theme.id==='kindness'){
      const n = Math.min(1 + Math.floor((state.run.player.care||0)/2), 3);
      for(let i=0;i<n;i++) room.care.push({x:randR(160,room.w-160,rng),y:randR(130,room.h-190,rng),r:34,used:false,kind:pick(['lamp','bench','umbrella','pie'],rng),phase:rng()*TAU});
    }

    // Enemy spawning
    if(level === 1){
      spawnEnemy(room,'moth', room.w*.5-190, room.h*.38, true);
      spawnEnemy(room,'receipt', room.w*.5+190, room.h*.38, true);
    } else if(level === 2){
      spawnEnemy(room,'charger', room.w*.5-240, room.h*.32, true);
      spawnEnemy(room,'receipt', room.w*.5, room.h*.30, true);
      spawnEnemy(room,'sludge', room.w*.5+240, room.h*.34, true);
    } else if(level === 3){
      spawnEnemy(room,'cart', room.w*.5-270, room.h*.34, true);
      spawnEnemy(room,'moth', room.w*.5, room.h*.30, true);
      spawnEnemy(room,'charger', room.w*.5+270, room.h*.34, true);
    } else if(level % 5 === 0){
      spawnEnemy(room,'boss', room.w*.5, 180, true);
      if(level>=10) spawnEnemy(room,'cart', room.w*.5-280, room.h*.36, true);
    } else {
      const pool=enemyPoolForRoom(level, theme);
      const n = clamp(5 + Math.floor(level*1.05) + Math.floor(rng()*3) + (theme.noMoon?1:0), 5, mobile?22:32);
      for(let i=0;i<n;i++) spawnEnemy(room,pick(pool,rng));
    }
    return room;
  }

  function enemyPoolForRoom(level, theme){
    const pool=['moth','moth','receipt','charger'];
    if(level>2) pool.push('sludge','sludge');
    if(level>4) pool.push('cart');
    if(level>6) pool.push('mirror');
    if(level>7) pool.push('wraith');
    if(level>9) pool.push('moon');
    if(theme && theme.noMoon){
      pool.push(...(theme.bias||[]), ...(theme.bias||[]));
      if(level>5) pool.push('censer','pewling');
      if(level>7) pool.push('longcandle','lectern');
      if(level>10) pool.push('antiphon','oxwarden');
      if(level>12) pool.push('crownsworn');
    }
    return pool.filter(t=>enemyDefs[t]);
  }

  function noMoonObstacleSpot(room, layout, i, n, rng){
    if(layout==='ring'){
      const a=(i/n)*TAU + rng()*.42, rr=Math.min(room.w,room.h)*(.23+rng()*.08);
      return {x:room.w*.5+Math.cos(a)*rr, y:room.h*.52+Math.sin(a)*rr};
    }
    if(layout==='crossroads'){
      const vertical=i%2===0, offset=(Math.floor(i/2)-Math.floor(n/4))*145 + randR(-35,35,rng);
      return vertical?{x:room.w*.5+offset,y:randR(190,room.h-230,rng)}:{x:randR(190,room.w-190,rng),y:room.h*.5+offset};
    }
    if(layout==='spine') return {x:room.w*.5+randR(-130,130,rng), y:randR(170,room.h-220,rng)};
    if(layout==='edges'){
      const side=i%4; if(side===0) return {x:randR(160,room.w-160,rng),y:150+randR(-40,40,rng)};
      if(side===1) return {x:room.w-150+randR(-35,35,rng),y:randR(170,room.h-220,rng)};
      if(side===2) return {x:randR(160,room.w-160,rng),y:room.h-150+randR(-35,35,rng)};
      return {x:150+randR(-35,35,rng),y:randR(170,room.h-220,rng)};
    }
    if(layout==='courtyard'){
      const a=(i/n)*TAU + rng()*.42, rr=Math.min(room.w,room.h)*(.23+rng()*.08);
      return {x:room.w*.5+Math.cos(a)*rr, y:room.h*.52+Math.sin(a)*rr};
    }
    if(layout==='lanesH') return {x:randR(180,room.w-180,rng),y:(i%3+1)*room.h/4+randR(-45,45,rng)};
    if(layout==='pockets'){
      const cols=[.24,.50,.76], rows=[.28,.52,.76];
      return {x:room.w*cols[i%cols.length]+randR(-80,80,rng),y:room.h*rows[Math.floor(i/cols.length)%rows.length]+randR(-60,60,rng)};
    }
    return {x:randR(170,room.w-230,rng), y:randR(170,room.h-260,rng)};
  }

  function seedNoMoonRoom(room, level, theme, rng){
    if(!theme || !theme.noMoon) return;
    room.mech = theme.mech;
    const h = theme.hazard;
    const count = mobile ? 3 : 5;
    if(h==='fog' || h==='spore'){
      for(let i=0;i<count;i++) room.hazards.push({type:h,x:randR(170,room.w-170,rng),y:randR(145,room.h-190,rng),r:randR(70,118,rng),phase:rng()*TAU,cd:0,color:h==='fog'?theme.a:theme.b});
    } else if(h==='snare' || h==='thorn'){
      for(let i=0;i<count;i++) room.hazards.push({type:h,x:randR(160,room.w-160,rng),y:randR(130,room.h-180,rng),r:randR(52,88,rng),phase:rng()*TAU,cd:rng()*1.2,color:h==='thorn'?theme.a:theme.b});

  }

  function chainFrom(x,y,damage){
    const room=state.room; let best=null,bd=Infinity; for(const e of room.enemies){ const d=dist(x,y,e.x,e.y); if(d<bd && d<390){best=e; bd=d;} }
    if(best){ damageEnemy(best,damage,rand(-80,80),rand(-80,80),'chain'); room.floats.push({x:best.x,y:best.y-26,text:'ϟ',life:.5,color:room.theme.c}); for(let i=0;i<8;i++) particle(room,x,y,room.theme.c,(best.x-x)*rand(1,3),(best.y-y)*rand(1,3),.25,2); }

  function tryPulse(){

  function resolveCircleObstacle(ent,o){
    if(o.type==='circle'){ const n=norm(ent.x-o.x,ent.y-o.y), min=ent.r+o.rad; if(n.m<min){ const push=min-n.m; ent.x+=n.x*push; ent.y+=n.y*push; ent.vx+=n.x*push*5; ent.vy+=n.y*push*5; } return; }
    const nx=clamp(ent.x,o.x,o.x+o.w), ny=clamp(ent.y,o.y,o.y+o.h); const n=norm(ent.x-nx,ent.y-ny); if(n.m<ent.r){ const push=ent.r-n.m; ent.x+=n.x*push; ent.y+=n.y*push; ent.vx+=n.x*push*5; ent.vy+=n.y*push*5; }
  }

  // ========== roommix2's 10-type hazard system ==========
  function distPointSegment(px,py,x1,y1,x2,y2){
    const vx=x2-x1, vy=y2-y1, wx=px-x1, wy=py-y1;
    const c=clamp((wx*vx+wy*vy)/Math.max(1,vx*vx+vy*vy),0,1);
    const x=x1+vx*c, y=y1+vy*c;
    return Math.hypot(px-x,py-y);
  }
  function updateHazards(room,p,dt){
    if(!room.hazards) room.hazards=[]; if(!room.lanes) room.lanes=[];
    for(const h of room.hazards){
      h.phase=(h.phase||0)+dt; h.cd=Math.max(0,(h.cd||0)-dt); h.hitCd=Math.max(0,(h.hitCd||0)-dt);
      const d=dist(h.x,h.y,p.x,p.y);
      if(h.type==='fog' || h.type==='spore'){
        if(d<h.r+p.r){ p.vx*=Math.pow(.72,dt*8); p.vy*=Math.pow(.72,dt*8); p.pulse=Math.max(0,p.pulse-dt*(h.type==='spore'?7:3)); if(h.type==='spore'&&h.cd<=0&&p.inv<=0){ h.cd=1.05; hurtPlayer(p,1,h.x,h.y); } }
        if(h.cd<=0 && h.type==='spore' && d<620){ h.cd=1.6+state.rng()*.8; const n=norm(p.x-h.x,p.y-h.y); shootEnemy(room,h,n.x,n.y,150,4.8,2.2,h.color||room.theme.b); }
      } else if(h.type==='snare' || h.type==='thorn'){
        if(d<h.r+p.r){ p.vx*=Math.pow(.62,dt*9); p.vy*=Math.pow(.62,dt*9); if(h.cd<=0&&p.inv<=0){ h.cd=1.05; hurtPlayer(p,1,h.x,h.y); } }
        if(h.cd<=0 && d<h.r+230){ h.cd=.9+state.rng()*.7; const n=norm(p.x-h.x,p.y-h.y); shootEnemy(room,h,n.x,n.y,h.type==='thorn'?245:170,5.6,1.5,h.color||room.theme.a); }
      } else if(h.type==='shard' || h.type==='volatile'){
        if(h.cd<=0 && d<850){ h.cd=h.type==='volatile'?1.25+state.rng()*.9:1.75+state.rng()*.8; const n=norm(p.x-h.x,p.y-h.y); const spread=h.type==='volatile'?[-.18,0,.18]:[0]; for(const off of spread){ const a=Math.atan2(n.y,n.x)+off; shootEnemy(room,h,Math.cos(a),Math.sin(a),h.type==='volatile'?290:410,4.6,2.15,h.color||room.theme.a); } }
        if(d<h.r+p.r && p.inv<=0){ hurtPlayer(p,1,h.x,h.y); }
      } else if(h.type==='pulse' || h.type==='ritual'){
        h.t=((h.t||0)+dt)%(h.period||2.3); const active=h.t>.64; const span=Math.min(room.w,room.h)*.55; h.wave=active?((h.t-.64)/Math.max(.1,(h.period||2.3)-.64))*span:0;
        if(active && h.hitCd<=0 && Math.abs(d-h.wave)<p.r+10){ h.hitCd=.55; hurtPlayer(p,1,h.x,h.y); }
      }
    }
    for(const l of room.lanes){
      l.t=((l.t||0)+dt)%(l.period||2.8); l.hitCd=Math.max(0,(l.hitCd||0)-dt); const active=l.t>.70 && l.t<1.05; const tele=l.t>.34 && l.t<=.70;

      if(active && l.hitCd<=0 && distPointSegment(p.x,p.y,l.x1,l.y1,l.x2,l.y2)<p.r+10){ l.hitCd=.65; hurtPlayer(p,1,(l.x1+l.x2)/2,(l.y1+l.y2)/2); }
    }
  }

  // ========== Enemy AI: 9 original + 7 No Moon from roommix2 ==========
  function updateEnemies(room,p,dt){

          }

        }

        }

          if(!e.awake){ e.awake=true; const a=Math.atan2(to.y,to.x)+rand(-.4,.4); e.vx=Math.cos(a)*e.speed*2.25; e.vy=Math.sin(a)*e.speed*2.25; }
          ax=to.x*e.speed*.34+Math.cos(e.phase*3.7)*74;
          ay=to.y*e.speed*.34+Math.sin(e.phase*4.4)*74;
          if(e.cd<=0&&to.m<650){ e.cd=1.35+state.rng()*.65; const base=Math.atan2(to.y,to.x); for(let k=-1;k<=1;k+=2){ const a=base+k*.28; shootEnemy(room,e,Math.cos(a),Math.sin(a),210+room.level*4,5.2,2.25,'#7dfdff'); } }
        }
        else if(e.type==='moon'){
          const orbit=Math.atan2(e.y-p.y,e.x-p.x)+Math.PI/2; const want=to.m<330?-1:to.m>540?1:.05; ax=to.x*e.speed*want+Math.cos(orbit)*92; ay=to.y*e.speed*want+Math.sin(orbit)*92;
          if(e.cd<=0&&to.m<840){ e.cd=Math.max(.88,1.65-room.level*.03); const count=room.level>12?6:4; for(let k=0;k<count;k++){ const a=Math.atan2(to.y,to.x)+(k-(count-1)/2)*.24; shootEnemy(room,e,Math.cos(a),Math.sin(a),215+room.level*6,6.4,2.9); } }
        }
        else if(e.type==='mirror'){
          const orbit=Math.atan2(e.y-p.y,e.x-p.x)-Math.PI/2; ax=to.x*e.speed*.78+Math.cos(orbit)*78; ay=to.y*e.speed*.78+Math.sin(orbit)*78;
          if(e.cd<=0&&to.m<650){ e.cd=1.08+state.rng()*.46; const a=Math.atan2(p.aimY,p.aimX)+Math.PI; shootEnemy(room,e,Math.cos(a),Math.sin(a),340,5.8,2.45,'#bd93ff'); }
        } else if(e.type==='wraith'){
          const vis = Math.sin(e.phase*1.6);

          if(e.wrVis){
            const orbit=Math.atan2(e.y-p.y,e.x-p.x)+Math.PI/2;
            ax=Math.cos(orbit)*e.speed*.6+to.x*e.speed*.35;

          if(e.aiming<=.03 && e.snipeX){ shootEnemy(room,e,e.snipeX,e.snipeY,520+room.level*6,4.9,2.15,e.color); e.snipeX=e.snipeY=0; }
        } else if(e.type==='antiphon'){

          if(e.cd<=0&&to.m<860){ e.cd=1.22+state.rng()*.45; const count=5+(room.level>10?2:0); const base=e.phase*.7; for(let k=0;k<count;k++){ const a=base+k*TAU/count; shootEnemy(room,e,Math.cos(a),Math.sin(a),165+room.level*3,4.8,2.6,e.color); } }
        } else if(e.type==='oxwarden'){
          ax=to.x*e.speed*.86+Math.cos(e.phase*.8)*24; ay=to.y*e.speed*.86+Math.sin(e.phase*.7)*24;
          if(e.cd<=0&&to.m<260){ e.cd=1.35+state.rng()*.55; for(let k=0;k<8;k++){ const a=k*TAU/8+e.phase*.2; shootEnemy(room,e,Math.cos(a),Math.sin(a),170,6.2,1.7,e.color); } }

  function spawnBullet(room,owner,x,y,vx,vy,r,damage,life,color,puddle=false){
    const cap=owner==='enemy'?(mobile?110:170):(mobile?90:160); let count=0; for(const b of room.bullets) if(b.owner===owner) count++; if(count>cap) return;
    const bounces = owner==='player' && state.run?.player?.bounce ? state.run.player.bounce : 0;
    room.bullets.push({owner,x,y,vx,vy,r,damage,life,max:life,color,puddle,bounces});
  }
  function shootEnemy(room,e,dx,dy,spd,r,life,color=e.color){ spawnBullet(room,'enemy',e.x+dx*(e.r||20),e.y+dy*(e.r||20),dx*spd,dy*spd,r,1,life,color,false); }

  function updateBullets(room,p,dt){
    for(let i=room.bullets.length-1;i>=0;i--){
      const b=room.bullets[i]; b.life-=dt;
      if(b.owner==='player' && !b.puddle){
        let best=null,bd=Infinity, sp=Math.hypot(b.vx,b.vy)||1;
        for(const e of room.enemies){
          if(e.hp<=0) continue; const d=dist(b.x,b.y,e.x,e.y);
          if(d<bd && d<420){ const dot=((e.x-b.x)*b.vx+(e.y-b.y)*b.vy)/(Math.max(1,d)*sp); if(dot>.18){ best=e; bd=d; } }
        }
        if(best){ const n=norm(best.x-b.x,best.y-b.y); b.vx=damp(b.vx,n.x*sp,8.5,dt); b.vy=damp(b.vy,n.y*sp,8.5,dt); }
      }
      if(!b.puddle){ b.x+=b.vx*dt; b.y+=b.vy*dt; }
      if(b.owner==='enemy' && p.magnet && b.r<=7 && dist(b.x,b.y,p.x,p.y)<70+p.magnet*18){ b.life=0; p.pulse=Math.min(100,p.pulse+2.6); particle(room,b.x,b.y,room.theme.a,rand(-60,60),rand(-60,60),.25,3); }
      if(b.owner==='player' && b.bounces>0 && !b.puddle){
        if(b.x<0 || b.x>room.w){ b.vx*=-1; b.x=clamp(b.x,0,room.w); b.bounces--; }
        if(b.y<0 || b.y>room.h){ b.vy*=-1; b.y=clamp(b.y,0,room.h); b.bounces--; }
      }
      if(b.life<=0 || b.x<-80 || b.y<-80 || b.x>room.w+80 || b.y>room.h+80){ room.bullets.splice(i,1); continue; }
      if(b.owner==='player'){
        for(const e of room.enemies){ if(e.hp>0 && dist(b.x,b.y,e.x,e.y)<b.r+e.r){ const k=norm(e.x-b.x,e.y-b.y); damageEnemy(e,b.damage,k.x*120,k.y*120,'shot'); b.life=0; break; } }
      } else if(p.inv<=0 && dist(b.x,b.y,p.x,p.y)<b.r+p.r){ room.bullets.splice(i,1); hurtPlayer(p,b.damage,b.x,b.y); continue; }
      if(b.life<=0){ room.bullets.splice(i,1); continue; }
    }
  }

  function damageEnemy(e,dmg,kx=0,ky=0,kind='hit'){
    if(e.hp<=0) return; e.hp-=dmg; e.vx+=kx; e.vy+=ky; e.hit=.11; e.stun=Math.max(e.stun,.032);
    const room=state.room; const pause = kind==='pulse'?30:kind==='dash'?18:kind==='chain'?16:10; tactilePause(pause); shake=Math.max(shake, kind==='pulse'?.16:kind==='dash'?.09:.035);
    for(let i=0;i<4 && room.particles.length<budget();i++) particle(room,e.x,e.y,kind==='pulse'?room.theme.c:e.color,rand(-90,90)+kx*.08,rand(-90,90)+ky*.08,.22,2+Math.random()*2.4);
    if(e.hp<=0) killEnemy(e);
  }

  function killEnemy(e){
    const room=state.room, run=state.run, p=run.player; e.hp=0; run.kills++; run.roomKills++; run.combo=Math.min(12,run.combo+(e.type==='boss'?.9:.14)); run.comboT=2.6; const score=Math.floor(e.score*run.combo*(run.overdrive?1.35:1)); run.score+=score; p.pulse=Math.min(100,p.pulse+(e.type==='boss'?18:5.2)*p.pulseGain);

  function drawNoMoonFloor(room, th){

  // v4.0 floor decorations

      ctx.globalAlpha=.06;
      if(d.type==='fogBank'){ ctx.fillStyle=th.a; ctx.beginPath(); ctx.ellipse(d.x,d.y,d.r*1.4,d.r*.6,d.a,0,TAU); ctx.fill(); ctx.beginPath(); ctx.ellipse(d.x+d.r*.3,d.y-d.r*.2,d.r,d.r*.5,d.a+.3,0,TAU); ctx.fill(); }

  // v4.0 ambient particles
  function drawAmbient(room){
    const t=performance.now()/1000;
    ctx.save();
    for(const a of room.ambient){
      const p=Math.sin(t*1.5+a.phase);

      else if(a.type==='petals'){ ctx.fillStyle=room.theme.b; ctx.globalAlpha=.10+.06*p; ctx.beginPath(); ctx.ellipse(a.x,a.y,a.r*2,a.r*.6,t*.2+a.phase,0,TAU); ctx.fill(); }
      else if(a.type==='spores'){ ctx.strokeStyle=room.theme.a; ctx.lineWidth=1; ctx.globalAlpha=.10+.06*p; ctx.beginPath(); ctx.arc(a.x,a.y,a.r*1.5,0,TAU); ctx.stroke(); ctx.beginPath(); ctx.arc(a.x,a.y,a.r*.4,0,TAU); ctx.fill(); }

  // roommix2's 10-type hazard drawing (lanes + area hazards)
  function drawHazards(room){
    const th=room.theme, t=performance.now()/1000;

    for(const h of room.hazards){ ctx.save(); ctx.translate(h.x,h.y); const phase=(h.phase||0)+t*.2; ctx.shadowColor=h.color||th.a; ctx.shadowBlur=18;
      if(h.type==='fog'||h.type==='spore'){
        ctx.globalAlpha=h.type==='fog'?.18:.24; const g=ctx.createRadialGradient(0,0,0,0,0,h.r); g.addColorStop(0,(h.color||th.a)+'99'); g.addColorStop(1,(h.color||th.a)+'00'); ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(0,0,h.r*(1+.05*Math.sin(phase*2)),h.r*.68,Math.sin(phase)*.16,0,TAU); ctx.fill();
        ctx.globalAlpha=.35; ctx.strokeStyle=h.color||th.b; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(0,0,h.r*.55,0,TAU); ctx.stroke();
      } else if(h.type==='snare'||h.type==='thorn'){
        ctx.globalAlpha=.72; ctx.strokeStyle=h.color||th.b; ctx.lineWidth=4; for(let k=0;k<7;k++){ const a=k*TAU/7+Math.sin(phase)*.15; ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(Math.cos(a+.4)*h.r*.55,Math.sin(a+.4)*h.r*.55,Math.cos(a)*h.r,Math.sin(a)*h.r); ctx.stroke(); }
        ctx.fillStyle='#0e120d'; ctx.beginPath(); ctx.arc(0,0,18,0,TAU); ctx.fill(); ctx.stroke();
      } else if(h.type==='shard'||h.type==='volatile'){
        ctx.globalAlpha=.88; ctx.fillStyle='#08131c'; ctx.strokeStyle=h.color||th.a; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(0,-h.r*1.25); ctx.lineTo(h.r*.72,h.r*.78); ctx.lineTo(-h.r*.55,h.r*.55); ctx.closePath(); ctx.fill(); ctx.stroke();

      } else if(h.type==='pulse'||h.type==='ritual'){
        ctx.globalAlpha=.82; ctx.fillStyle='#090612'; ctx.strokeStyle=h.color||th.a; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(0,0,h.r,0,TAU); ctx.fill(); ctx.stroke();

      }
      ctx.restore(); }
  }

  function drawCare(room){
    const th=room.theme, t=performance.now()/1000; for(const c of room.care){ ctx.save(); ctx.translate(c.x,c.y+Math.sin(t*2+c.phase)*4); ctx.globalAlpha=c.used?.28:1; ctx.shadowColor=th.c; ctx.shadowBlur=c.used?0:18; if(c.kind==='lamp'){ ctx.fillStyle=th.c; ctx.beginPath(); ctx.arc(0,-12,16,0,TAU); ctx.fill(); ctx.strokeStyle='#fff8'; ctx.beginPath(); ctx.moveTo(0,4); ctx.lineTo(0,28); ctx.stroke(); } else if(c.kind==='bench'){ ctx.fillStyle='#2a1a20'; roundRect(ctx,-34,-8,68,18,6); ctx.fill(); ctx.fillStyle=th.c; ctx.fillRect(-29,10,7,28); ctx.fillRect(22,10,7,28); } else if(c.kind==='umbrella'){ ctx.fillStyle=th.c; ctx.beginPath(); ctx.arc(0,0,34,Math.PI,TAU); ctx.lineTo(34,0); ctx.closePath(); ctx.fill(); ctx.strokeStyle='#fff8'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,34); ctx.stroke(); } else { ctx.fillStyle='#f7d18b'; ctx.beginPath(); ctx.ellipse(0,0,34,18,0,0,TAU); ctx.fill(); ctx.fillStyle='#7b2f4a'; ctx.beginPath(); ctx.arc(-9,-2,5,0,TAU); ctx.arc(10,1,5,0,TAU); ctx.fill(); } ctx.restore(); }

  function drawPickups(room){ const t=performance.now()/1000; for(const q of room.pickups){ ctx.save(); ctx.translate(q.x,q.y+Math.sin(t*5+q.x*.01)*3); if(q.type==='heart'){ ctx.fillStyle='#ff6b9b'; heartPath(0,0,12); ctx.fill(); } else { ctx.fillStyle=room.theme.c; ctx.shadowColor=room.theme.c; ctx.shadowBlur=12; starPath(0,0,8,3.5,5); ctx.fill(); } ctx.restore(); } }

  // v4.0 pretty 4-layer bullet trails
  function drawBullets(room){
    for(const b of room.bullets){
      ctx.save();
      ctx.globalAlpha=clamp(b.life/(b.max||b.life),.22,1);
      if(b.puddle){
        ctx.shadowColor=b.color; ctx.shadowBlur=20; ctx.fillStyle=b.color+'44';
        ctx.beginPath(); ctx.arc(b.x,b.y,b.r*(1+.07*Math.sin(performance.now()/120)),0,TAU); ctx.fill();
        ctx.strokeStyle=b.color+'aa'; ctx.stroke();

        ctx.globalCompositeOperation='screen';
        const tLen=18; const g=ctx.createLinearGradient(b.x+tx*tLen,b.y+ty*tLen,b.x,b.y);
        g.addColorStop(0,'transparent'); g.addColorStop(1,b.color+'88');

        ctx.fillStyle=b.color; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,TAU); ctx.fill();

  // ========== Enemy drawing: 9 original + 7 No Moon from roommix2 ==========
  function drawEnemies(room){
    const t=performance.now()/1000;
    for(const e of room.enemies){
      ctx.save(); ctx.translate(e.x,e.y);
      const pulse=1+Math.sin(t*5+e.phase)*.035+(e.hit>0?.16:0);
      ctx.scale(pulse,pulse); ctx.shadowColor=e.color; ctx.shadowBlur=e.hit>0?28:14;
      if(e.type==='moth') drawMoth(e,room.theme);
      else if(e.type==='receipt') drawReceipt(e,room.theme);
      else if(e.type==='sludge') drawSludge(e,room.theme);
      else if(e.type==='charger') drawCharger(e,room.theme);
      else if(e.type==='cart') drawCart(e,room.theme);
      else if(e.type==='moon') drawMoon(e,room.theme);
      else if(e.type==='mirror') drawMirror(e,room.theme);
      else if(e.type==='wraith') drawWraith(e,room.theme);
      else if(e.type==='pewling') drawPewling(e,room.theme);
      else if(e.type==='censer') drawCenser(e,room.theme);
      else if(e.type==='lectern') drawLectern(e,room.theme);
      else if(e.type==='longcandle') drawLongCandle(e,room.theme);
      else if(e.type==='antiphon') drawAntiphon(e,room.theme);
      else if(e.type==='oxwarden') drawOxWarden(e,room.theme);
      else if(e.type==='crownsworn') drawCrownSworn(e,room.theme);
      else drawBoss(e,room.theme);
      if(e.elite){ ctx.strokeStyle=room.theme.c; ctx.lineWidth=3; ctx.setLineDash([7,5]); ctx.beginPath(); ctx.arc(0,0,e.r+8,0,TAU); ctx.stroke(); ctx.setLineDash([]); }

      ctx.restore();
      if(e.tele>0){
        ctx.save(); ctx.strokeStyle=room.theme.bad+'cc'; ctx.lineWidth=4; ctx.setLineDash([16,10]); ctx.beginPath(); ctx.moveTo(e.x,e.y); ctx.lineTo(e.x+(e.chargeX||0)*260,e.y+(e.chargeY||0)*260); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
      }
    }
  }

  function drawMoth(e,th){

    ctx.save(); ctx.rotate(.42-flap); ctx.fillStyle='#f2d7ff'; ctx.strokeStyle=e.color; ctx.lineWidth=2; ctx.beginPath(); ctx.ellipse(18,-2,17,31,.22,0,TAU); ctx.fill(); ctx.stroke(); ctx.fillStyle='#090612'; for(let y=-18;y<15;y+=8) ctx.fillRect(7,y,18,2); ctx.restore();

    ctx.strokeStyle=e.color; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(-5,-16); ctx.quadraticCurveTo(-19,-29,-24,-34); ctx.moveTo(5,-16); ctx.quadraticCurveTo(19,-29,24,-34); ctx.stroke();
    drawEnemyEyes(-4,-5,4,4,e.color);

  function drawSludge(e,th){

  function roundRect(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.lineTo(x+w-r,y); c.quadraticCurveTo(x+w,y,x+w,y+r); c.lineTo(x+w,y+h-r); c.quadraticCurveTo(x+w,y+h,x+w-r,y+h); c.lineTo(x+r,y+h); c.quadraticCurveTo(x,y+h,x,y+h-r); c.lineTo(x,y+r); c.quadraticCurveTo(x,y,x+r,y); c.closePath(); }
  function starPath(x,y,r1,r2,n){ ctx.beginPath(); for(let i=0;i<n*2;i++){ const a=-Math.PI/2+i*Math.PI/n; const r=i%2?r2:r1; ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r); } ctx.closePath(); }
  function heartPath(x,y,s){ ctx.beginPath(); ctx.moveTo(x,y+s*.42); ctx.bezierCurveTo(x-s*1.25,y-s*.24,x-s*.72,y-s*.95,x,y-s*.45); ctx.bezierCurveTo(x+s*.72,y-s*.95,x+s*1.25,y-s*.24,x,y+s*.42); }
  function shadow(x,y,w,h,a){ ctx.save(); ctx.globalAlpha=a; ctx.fillStyle='#000'; ctx.beginPath(); ctx.ellipse(x,y,w,h,0,0,TAU); ctx.fill(); ctx.restore(); }

  // ---------- UI ----------
  function updateHUD(){
    if(!state.run){ ui.zone.textContent='Boon Moots'; ui.hp.textContent='♥♥♥♥♥'; ui.score.textContent='0'; ui.room.textContent='room 0'; ui.combo.textContent='two thumbs'; ui.pulseFill.style.width='0%'; return; }
    const p=state.run.player, r=state.run; ui.zone.textContent=state.room.theme.name; ui.hp.textContent='♥'.repeat(Math.max(0,p.hp))+'♡'.repeat(Math.max(0,p.maxHp-p.hp))+(p.shield?` +${p.shield}`:''); ui.score.textContent=Math.floor(r.score).toLocaleString(); ui.room.textContent=`room ${r.level}${r.overdrive?'∞':''}`; ui.combo.textContent=`x${r.combo.toFixed(1)}`; ui.pulseFill.style.width=`${clamp(p.pulse,0,100)}%`; ui.sound.textContent=state.muted?'sound off':'sound on'; }
  function showOverlay(title,copy,buttons){ ui.overlayTitle.textContent=title; ui.overlayCopy.textContent=copy; ui.overlayButtons.innerHTML=''; for(const [label,fn] of buttons){ const b=document.createElement('button'); b.className='bigBtn'; b.textContent=label; b.onclick=fn; ui.overlayButtons.appendChild(b); } ui.overlay.classList.add('show'); }
  function hideOverlay(){ ui.overlay.classList.remove('show'); }
  function hideUpgrade(){ ui.upgrade.classList.remove('show'); }
  function showTitle(){ state.mode='title'; showOverlay('Boon Moots', 'The road grins. The boots answer. No Moon keeps breaking into the room wearing fake glasses.', [['Play',()=>startRun()],['Shrine',()=>showShrine()],['Codex',()=>toggleCodex(true)]]); updateHUD(); }
  function toggleSound(){ state.muted=!state.muted; state.save.sound=!state.muted; audio.mute(state.muted); if(!state.muted) audio.ensure(); saveNow(); updateHUD(); }
  function togglePause(){
    if(state.mode==='pause'){ ui.pause.classList.remove('show'); state.mode=state.oldMode||'play'; }
    else if(state.mode==='play'){ state.oldMode=state.mode; state.mode='pause'; ui.pause.classList.add('show'); ui.pauseSoundBtn.textContent=state.muted?'sound off':'sound on'; }
  }
  function toggleCodex(force=false){
    if(force || state.mode!=='codex'){ state.oldMode=state.mode; state.mode='codex'; renderCodex(); ui.codex.classList.add('show'); }
    else { ui.codex.classList.remove('show'); state.mode=state.oldMode||'play'; }
  }
  function showShrine(){
    state.oldMode=state.mode; state.mode='shrine';
    const sh=state.save.shrine||{}; const sparks=state.save.sparks||0;
    document.getElementById('shrineSparks').textContent='✦ '+sparks.toLocaleString()+' sparks';
    ui.shrineCards.innerHTML='';
    for(const sd of shrineDefs){
      const owned=!!sh[sd.id]; const canBuy=!owned&&sparks>=sd.cost;
      const card=document.createElement('button');
      card.className='shrineCard'+(owned?' owned':'');
      card.innerHTML=`<b>${html(sd.name)}</b><p>${html(sd.desc)}</p><div class="sCost">${owned?'Owned':(canBuy?'Buy · '+sd.cost+' sparks':'Need '+sd.cost+' sparks (have '+sparks+')')}</div>`;
      if(canBuy) card.onclick=()=>{ state.save.sparks-=sd.cost; if(!state.save.shrine) state.save.shrine={}; state.save.shrine[sd.id]=true; saveNow(); showShrine(); };
      ui.shrineCards.appendChild(card);
    }
    ui.shrine.classList.add('show');
  }
  function hideShrine(){ ui.shrine.classList.remove('show'); if(state.mode==='shrine') state.mode=state.oldMode||'title'; }
  function renderCodex(){
    const notices=(state.save.notices||[]).slice(-18).reverse();
    const bestiary=state.save.bestiary||{};
    const picks=state.save.upgradePicks||{};
    let bestiaryHtml='';
    for(const [key,info] of Object.entries(bestiaryInfo)){
      const kills=bestiary[key]||0;
      bestiaryHtml+=`<div class="codexCard"><b>${info.icon} ${html(info.name)}</b><p>${html(info.desc)}</p><p style="color:#ffd36e;font-size:12px;margin-top:4px">Kills: ${kills}</p></div>`;
    }
    let favUp='none yet';
    if(Object.keys(picks).length){
      const top=Object.entries(picks).sort((a,b)=>b[1]-a[1])[0];
      const def=upgradeDefs.find(u=>u.id===top[0]);
      if(def) favUp=def.icon+' '+def.name+' ('+top[1]+'x)';
    }
    ui.codexBody.innerHTML=`<h3>Bestiary</h3><div class="codexGrid">${bestiaryHtml}</div><h3>Stats</h3><p>Runs: ${(state.save.runs||0).toLocaleString()} · Best score: ${Math.floor(state.save.bestScore||0).toLocaleString()} · Best room: ${state.save.bestRoom||0}<br>Total kills: ${(state.save.totalKills||0).toLocaleString()} · Total rooms: ${(state.save.totalRooms||0).toLocaleString()} · Sparks: ${(state.save.sparks||0).toLocaleString()}<br>Favorite upgrade: ${favUp}</p>`;
  }
  ui.sound.addEventListener('click', toggleSound); ui.codexBtn.addEventListener('click', () => toggleCodex(true)); ui.closeCodex.addEventListener('click', () => toggleCodex());
  ui.resumeBtn.addEventListener('click', () => togglePause());
  ui.pauseCodexBtn.addEventListener('click', () => { togglePause(); toggleCodex(true); });
  ui.pauseSoundBtn.addEventListener('click', () => { toggleSound(); ui.pauseSoundBtn.textContent=state.muted?'sound off':'sound on'; });
  ui.closeShrine.addEventListener('click', () => hideShrine());

  let last=performance.now(); function frame(t){ const dt=Math.min(.05,(t-last)/1000); last=t; update(dt); draw(); requestAnimationFrame(frame); }
  function finalSave(){ if(state.run){ state.save.bestScore=Math.max(state.save.bestScore||0,Math.floor(state.run.score)); state.save.bestRoom=Math.max(state.save.bestRoom||0,state.run.level); } saveNow(); }
  addEventListener('pagehide',finalSave); addEventListener('beforeunload',finalSave);

  window.passengerTactileSelfTest = window.passengerThumbprintSelfTest = () => {
    const nodes=[...document.querySelectorAll('button,.touchTarget')].map(n=>{ const r=n.getBoundingClientRect(); return {text:(n.textContent||'').trim().slice(0,40), cls:n.className, w:Math.round(r.width), h:Math.round(r.height), visible:r.width>0&&r.height>0}; });
    const small=nodes.filter(n=>n.visible&&(n.w<44||n.h<44));
    return {ok:small.length===0 && document.documentElement.scrollWidth<=innerWidth+1, version:VERSION, viewport:{w:innerWidth,h:innerHeight,dpr:DPR,mobile,portrait}, horizontalOverflow:document.documentElement.scrollWidth-innerWidth, smallTargets:small, state:window.passengerThumbprintDebug()};
  };
  window.passengerTactileDebug = window.passengerThumbprintDebug = () => ({version:VERSION,mode:state.mode,room:state.room?{level:state.room.level,enemies:state.room.enemies.length,bullets:state.room.bullets.length,hazards:(state.room.hazards||[]).length,lanes:(state.room.lanes||[]).length,particles:state.room.particles.length,cleared:state.room.cleared}:null,run:state.run?{score:Math.floor(state.run.score),level:state.run.level,hp:state.run.player.hp,pulse:Math.floor(state.run.player.pulse),upgrades:state.run.upgrades}:null,save:state.save});
  window.passengerTactileStart = window.passengerThumbprintStart = () => startRun();
  window.passengerTactileSkipRoom = window.passengerThumbprintSkipRoom = () => { if(!state.run) startRun(); else nextRoom(); updateHUD(); return window.passengerThumbprintDebug(); };
  window.passengerTactileUnlockAll = window.passengerThumbprintUnlockAll = () => { state.save.notices=[...clearLines,...Object.values(behaviorNotices)]; saveNow(); renderCodex(); return state.save; };
  window.passengerTactileReset = window.passengerThumbprintReset = () => { localStorage.removeItem(SAVE_KEY); location.reload(); };

  showTitle(); requestAnimationFrame(frame);
})();

</script>
</body>
</html>
